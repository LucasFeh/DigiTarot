name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  # Permite republicar pela aba Actions, sem precisar de um commit novo.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; se chegar outra, a anterior é cancelada.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build
        # As chaves do Firebase são opcionais: sem elas o site sobe em modo
        # local. Para ligar de verdade, cadastre-as em
        # Settings › Secrets and variables › Actions.
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_PIX_CHAVE: ${{ secrets.VITE_PIX_CHAVE }}
          VITE_PIX_NOME: ${{ secrets.VITE_PIX_NOME }}
          VITE_PIX_CIDADE: ${{ secrets.VITE_PIX_CIDADE }}
          VITE_WHATSAPP: ${{ secrets.VITE_WHATSAPP }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
